# Local Seq, used as a throwaway stand-in for the remote Seq while developing/testing the
# error-watch scheduler. Bring it up with:
#
#   docker compose -f docker-compose.seq.yml up -d
#
# Then point Erda at it (Seq:ServerUrl=http://localhost:5341, no API key needed locally) and
# open the UI at http://localhost:5341. Tear down with `docker compose -f docker-compose.seq.yml down`.
services:
  seq:
    image: datalust/seq:latest
    container_name: erda-seq
    environment:
      ACCEPT_EULA: "Y"
      # Local throwaway instance: allow anonymous access (no API key needed). Modern Seq refuses
      # to start on first run without either this or SEQ_FIRSTRUN_ADMINPASSWORD. The REMOTE Seq
      # you point Erda at in production should keep auth on and use Seq:ApiKey instead.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"   # UI + ingestion + query API all on one port
    volumes:
      - erda-seq-data:/data
    restart: unless-stopped

volumes:
  erda-seq-data:
