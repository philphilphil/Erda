# Erda homeserver stack: erda + whatsapp-bridge + obsidian-sync. Images built/pushed to GHCR by CI;
# `build:` blocks kept only for local `docker compose up -d --build`. Config is env-only via .env
# (app keys: Erda__…, WhatsApp__…, Seq__…, OPENAI_API_KEY); .env also feeds the ${…} below.
# First run: `docker compose run --rm whatsapp-bridge` (QR), `… run --rm obsidian-sync setup` (login).
# Server: `docker compose pull && docker compose up -d`.

name: erda

services:
  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    image: ghcr.io/philphilphil/whatsapp-bridge:latest
    restart: unless-stopped
    environment:
      BRIDGE_LISTEN: 0.0.0.0:8088
      ERDA_INBOUND_URL: http://erda:5167/channel/whatsapp/in
      SESSION_DB: /data/whatsmeow-session.db
      MEDIA_DIR: /media
      SHARED_SECRET: ${WhatsApp__SharedSecret:?set WhatsApp__SharedSecret in .env}
      OWNER_JID: ${OWNER_JID:?set OWNER_JID in .env}
    volumes:
      - bridge-data:/data
      - media:/media
    networks: [erdanet]

  # Official headless Obsidian Sync client. Bootstrap once: `docker compose run --rm obsidian-sync setup`.
  obsidian-sync:
    build:
      context: ./obsidian-sync
    image: ghcr.io/philphilphil/obsidian-sync:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      init-perms:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - vault:/vault
      - obsidian-config:/config
    networks: [erdanet]

  # Chown the (root-owned) named volumes so the 1000:1000 services can write, then exit.
  init-perms:
    image: alpine:3.21
    command: ["chown", "1000:1000", "/data/erda", "/media", "/data/browser", "/vault", "/config"]
    volumes:
      - erda-data:/data/erda
      - media:/media
      - browser-data:/data/browser
      - vault:/vault
      - obsidian-config:/config

  erda:
    build:
      context: .
    image: ghcr.io/philphilphil/erda:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      whatsapp-bridge:
        condition: service_started
      obsidian-sync:
        condition: service_started
      init-perms:
        condition: service_completed_successfully
    ports:
      - "${PANEL_BIND:-0.0.0.0}:5167:5167"
    # Reach the chat/reasoning proxy running on the host (Erda__ChatBaseUrl); the proxy must bind 0.0.0.0.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5167
    volumes:
      - vault:/vault
      - erda-data:/data/erda
      - media:/media
      - browser-data:/data/browser
    networks: [erdanet]

networks:
  erdanet:
    driver: bridge

# Named volumes at /var/lib/docker/volumes/erda_<name>/_data — back up directly.
volumes:
  bridge-data:
  erda-data:
  media:
  browser-data:
  vault:
  obsidian-config:
