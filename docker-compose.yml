# Erda stack for the homeserver (amd64) deployment — self-contained. Images are built and pushed to
# GHCR by CI (.github/workflows/build.yml); the server pulls them (Komodo or `make deploy`). The
# `build:` blocks below are kept only so local dev can still `docker compose up -d --build`.
#
# Three services: erda, the whatsapp-bridge, and obsidian-sync (keeps the vault synced from inside
# the stack, so nothing relies on host-side sync). Erda publishes its control panel on the home LAN
# (port 5167; the Vue SPA at the root, the JSON API under /api); the bridge and sync stay unpublished.
# Erda runs Production. For an ARM64 host (e.g. the old Jetson), override the arch ARGs in Dockerfile.
#
# Configuration is env-only. `.env` (next to this file; git-ignored) holds every setting using the
# app's own keys (Erda__…, WhatsApp__…, Seq__…, plus the flat AZURE_OPENAI_*/OPENAI_API_KEY). The
# erda container loads it verbatim via `env_file`, so there is NO per-variable mapping here. Compose
# also auto-reads `.env` for the ${…} substitutions below (host paths, bridge secret). Copy
# .env.example to .env and fill it in; in Komodo, set the same keys as the Stack's environment.
#
#   First run (link WhatsApp):       docker compose run --rm whatsapp-bridge   # scan the QR
#   First run (link Obsidian Sync):  docker compose run --rm obsidian-sync setup   # login + pick vault
#   Normal (server):                 docker compose pull && docker compose up -d   # prebuilt images from GHCR
#   Local dev (build locally):       docker compose up -d --build                  # `build:` blocks below

name: erda

services:
  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    image: ghcr.io/philphilphil/whatsapp-bridge:latest   # prebuilt by CI; `build:` kept for local dev
    restart: unless-stopped
    environment:
      BRIDGE_LISTEN: 0.0.0.0:8088                                   # all-interfaces INSIDE the container; still unpublished
      ERDA_INBOUND_URL: http://erda:5167/channel/whatsapp/in
      SESSION_DB: /data/whatsmeow-session.db
      MEDIA_DIR: /media
      # The bridge shares Erda's secret (same value) and needs the owner JID (a bridge-only format).
      SHARED_SECRET: ${WhatsApp__SharedSecret:?set WhatsApp__SharedSecret in .env}
      OWNER_JID: ${OWNER_JID:?set OWNER_JID in .env}
    volumes:
      - ./bridge:/data         # persistent whatsmeow session — survives rebuilds
      - ./media:/media          # SHARED with erda (same path); downloaded media
    networks: [erdanet]

  # Obsidian Sync sidecar: keeps the shared ./vault dir continuously synced from inside the stack
  # (official headless client). Replaces the old host-side sync requirement, so the homeserver needs
  # nothing but Docker. Shares ./vault with erda and runs as 1000:1000 so both write with the
  # same owner. Bootstrap once: `docker compose run --rm obsidian-sync setup` (or set
  # OBSIDIAN_AUTH_TOKEN in .env for fully non-interactive auth). See obsidian-sync/entrypoint.sh.
  obsidian-sync:
    build:
      context: ./obsidian-sync
    image: ghcr.io/philphilphil/obsidian-sync:latest   # prebuilt by CI; `build:` kept for local dev
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      init-perms:
        condition: service_completed_successfully
    # OBSIDIAN_VAULT_NAME (required) + OBSIDIAN_AUTH_TOKEN (optional, non-interactive auth) come from .env.
    env_file:
      - .env
    volumes:
      - ./vault:/vault          # SHARED with erda (same path)
      - ./obsidian-config:/config   # persisted login token + sync-setup state — survives rebuilds
    networks: [erdanet]

  # One-shot: Docker auto-creates missing bind-mount dirs root-owned, but erda + obsidian-sync run as
  # 1000:1000. Chown the dirs they must write — the SQLite DB (/data/erda), the shared /media dir, the
  # browser profile (/data/browser), the synced vault (/vault), and the Obsidian session (/config) —
  # then exit (chown on a bind mount changes the host dir). Runs as root (no `user:`), so a fresh
  # checkout self-heals with no manual chown step.
  init-perms:
    image: alpine:3.21
    command: ["chown", "1000:1000", "/data/erda", "/media", "/data/browser", "/vault", "/config"]
    volumes:
      - ./erda-data:/data/erda
      - ./media:/media
      - ./browser:/data/browser
      - ./vault:/vault
      - ./obsidian-config:/config

  erda:
    build:
      context: .
    image: ghcr.io/philphilphil/erda:latest   # prebuilt by CI; `build:` kept for local dev
    restart: unless-stopped
    # Run as the host owner (phil = 1000:1000) so the codex CLI subprocess writes files into the
    # bind-mounted /codex (= host ~/.codex) as phil, not root. Otherwise root-owned files pile up
    # in ~/.codex and break the interactive `codex` on the host. The ./data bind dirs Docker creates
    # root-owned are chowned to 1000:1000 by the init-perms one-shot above, which erda waits for.
    user: "1000:1000"
    depends_on:
      whatsapp-bridge:
        condition: service_started
      obsidian-sync:
        condition: service_started
      init-perms:
        condition: service_completed_successfully
    ports:
      - "${PANEL_BIND:-0.0.0.0}:5167:5167"                         # control panel (home LAN; set PANEL_BIND to a LAN IP to restrict)
    # Every Erda setting comes from .env, using the app's own keys. Missing required values stop the
    # app at startup with a clear, aggregated error (see CredentialsOptions / the feature validators).
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production                           # control panel (SPA + /api) served at the root
      ASPNETCORE_URLS: http://0.0.0.0:5167
      CODEX_HOME: /codex                                           # codex reads its logged-in session from here
    volumes:
      - ${CODEX_DIR:?set CODEX_DIR (absolute) in .env}:/codex       # logged-in ChatGPT-subscription session, RW
      - ./vault:/vault                                        # Obsidian vault, kept synced by the obsidian-sync sidecar
      - ./erda-data:/data/erda                                     # SQLite DB (reminders, prompt versions, activity) — survives redeploys
      - ./media:/media                                        # SHARED with the bridge (same path)
      - ./browser:/data/browser                               # persistent browser profile (logged-in session)
    networks: [erdanet]

networks:
  erdanet:
    driver: bridge

# All persistent state lives in flat dirs next to this file (bind mounts) instead of named volumes,
# so it's covered by whatever backs up this directory. Git-ignored. Created/owned automatically by the
# init-perms one-shot on first `up`.
#   ./vault            — the Obsidian vault (synced by obsidian-sync)
#   ./obsidian-config  — Obsidian Sync session (auth token + sync-setup state)
#   ./erda-data        — SQLite DB (reminders, prompt versions, activity)
#   ./media            — downloaded/shared media (bridge ⇄ erda)
#   ./browser          — persistent browser profile
#   ./bridge           — whatsmeow (WhatsApp) session
