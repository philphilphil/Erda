# Build the three Erda images and push them to GHCR.
#
# CI now owns the build (the homeserver no longer checks out source or builds): on every push to
# main — and on pushed v* tags — this builds erda, whatsapp-bridge, and obsidian-sync for
# linux/amd64 (the homeserver's arch) and pushes them to ghcr.io/philphilphil/<name>. The server
# (or Komodo) then just `docker compose pull && up -d` against those prebuilt images. The compose
# `build:` blocks are kept only for local dev. workflow_dispatch allows a manual rebuild.
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erda
            context: .
            dockerfile: ./Dockerfile
          - name: whatsapp-bridge
            context: ./whatsapp-bridge
            dockerfile: ./whatsapp-bridge/Dockerfile
          - name: obsidian-sync
            context: ./obsidian-sync
            dockerfile: ./obsidian-sync/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philphilphil/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build timestamp
        id: now
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Image identity for the erda image's WhatsApp boot notice (StartupNotifier); the other
          # two Dockerfiles don't declare these ARGs and just warn-and-ignore them.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.now.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
