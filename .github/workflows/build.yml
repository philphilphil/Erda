# Build the three Erda images and push them to GHCR.
#
# CI now owns the build (the homeserver no longer checks out source or builds): on every push to
# main — and on pushed v* tags — this builds erda, whatsapp-bridge, and obsidian-sync for
# linux/amd64 (the homeserver's arch) and pushes them to ghcr.io/philphilphil/<name>. The server
# (or Komodo) then just `docker compose pull && up -d` against those prebuilt images. The compose
# `build:` blocks are kept only for local dev. workflow_dispatch allows a manual rebuild.
#
# The `deploy` job then tells Komodo to redeploy. It lives here, at the end of the build, rather
# than as a git webhook on the repo, because those fire on *different* events: a git webhook fires
# the moment a commit lands, minutes before the images it describes exist, so Komodo would redeploy
# the previous `:latest` and then sit on it. "The images are ready" is only knowable here.
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erda
            context: .
            dockerfile: ./Dockerfile
          - name: whatsapp-bridge
            context: ./whatsapp-bridge
            dockerfile: ./whatsapp-bridge/Dockerfile
          - name: obsidian-sync
            context: ./obsidian-sync
            dockerfile: ./obsidian-sync/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philphilphil/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build timestamp
        id: now
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Image identity for the erda image's WhatsApp boot notice (StartupNotifier); the other
          # two Dockerfiles don't declare these ARGs and just warn-and-ignore them.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.now.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy the Komodo stack
    # Every image, or nothing: a partial deploy would run a new erda against an old bridge.
    needs: images
    # Only `main` moves `:latest`, which is what the stack's compose pulls. A v* tag publishes
    # version tags nothing on the server refers to, so deploying on one would redeploy the
    # unchanged `:latest` and say it did something.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # `DeployStack` is `docker compose up` on the Komodo side, so the stack needs "Pre Pull
      # Images" enabled — without it compose reuses the `:latest` it already has and the deploy
      # is a no-op that reports success.
      - name: Deploy
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          set -euo pipefail
          # Checked by hand: an unset secret otherwise reaches curl as an empty URL and fails as
          # something that reads like a network problem.
          for v in KOMODO_URL KOMODO_API_KEY KOMODO_API_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set — add it under Settings ▸ Secrets and variables ▸ Actions."
              exit 1
            fi
          done
          # `--fail-with-body` so a rejected key prints Komodo's own error rather than exit 22
          # alone. No `--retry`: curl counts a 500 as transient, and Komodo answers 500 for a name
          # that matches no stack, so a typo here was reported four identical times. Only the
          # connection is worth retrying, and `--retry-connrefused` needs `--retry` to do anything,
          # so a refused connection simply fails — Komodo being down is not this job's problem to
          # paper over.
          #
          # The stack is matched by its name exactly as it reads in Komodo, lowercase included.
          curl --silent --show-error --fail-with-body --max-time 60 \
            -X POST "${KOMODO_URL%/}/execute" \
            -H 'content-type: application/json' \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -d '{"type":"DeployStack","params":{"stack":"erda"}}'
